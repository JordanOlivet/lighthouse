services:
  lighthouse:
    image: ghcr.io/jordanolivet/lighthouse:latest
    container_name: lighthouse
    ports:
      - "3030:80"
    environment:
      # JWT Secret (must be set in .env)
      # WARNING: Generate a strong key in production (min 32 random characters)
      - Jwt__Secret=${JWT_SECRET:-CHANGE-THIS-SECRET-KEY-IN-PRODUCTION-MIN-32-CHARS}
      # Docker Host
      - Docker__Host=${DOCKER_HOST:-unix:///var/run/docker.sock} # For linux host
      # - Docker__Host=${DOCKER_HOST:-npipe://./pipe/docker_engine} # For windows host
      # Application base URL (used in emails for password reset links)
      # Set this to the external URL users access the app from (e.g., https://lighthouse.example.com)
      - Email__AppBaseUrl=${APP_BASE_URL:-http://localhost:3030}
      # SSO login (OpenID Connect) - see DEPLOYMENT.md "SSO Login (OIDC)"
      # Provider callback URL: ${APP_BASE_URL}/api/auth/oidc/callback
      # - Oidc__Authority=https://id.example.com
      # - Oidc__ClientId=${OIDC_CLIENT_ID}
      # - Oidc__ClientSecret=${OIDC_CLIENT_SECRET}
      # - Oidc__DisplayName=Pocket ID
      # - Oidc__AutoRedirect=true        # skip the Lighthouse login page
      # - Oidc__AutoProvision=false      # true = create accounts for unknown users
      # Logging (initial level only; change it live from the UI: Settings > General)
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
    volumes:
      # Database persistence
      - app-data:/app/data
      # Docker socket access (Linux/Mac)
      - /var/run/docker.sock:/var/run/docker.sock
      # Windows Docker socket (uncomment if on Windows and comment the line above):
      # - //./pipe/docker_engine://./pipe/docker_engine
      # Docker config for registry credentials (uses host's Docker login)
      # This allows the app to use existing host credentials and persist new logins
      # Linux/Mac:
      - ${HOME}/.docker:/root/.docker
      # Windows (uncomment and adjust path if needed):
      # - ${USERPROFILE}/.docker:/root/.docker
      # Logs persistence
      - ./logs:/app/logs
      # Compose files directory
      - ./compose-files:/app/compose-files
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  app-data:
    driver: local
