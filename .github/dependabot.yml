version: 2
updates:
  # Backend .NET (NuGet)
  - package-ecosystem: "nuget"
    directory: "/lighthouse-back"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/lighthouse-front"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # svelte-check (<= 4.7.8) peers on typescript ^5 || ^6; TS 7 breaks `npm ci`.
      # Remove once a svelte-check release supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
      - "/debug"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      docker-all:
        patterns: ["*"]

  # GitHub Actions (workflows + composite actions)
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-dotnet"
      - "/.github/actions/setup-node"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
